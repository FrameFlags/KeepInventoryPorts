name: Keep Inventory in-game behavior test

on: [push, pull_request, workflow_dispatch]

permissions:
  contents: read

jobs:
  behavior:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        include:
          - { variant: 26.3-fabric,    mc: '26.3',    loader: fabric,   mrt: fabric,   java: '25', gradle: '9.8.2', api: 0.165.0, product: 'true' }
          - { variant: 26.3-neoforge,  mc: '26.3',    loader: neoforge, mrt: neoforge, java: '25', gradle: '9.2.1', api: 'none',      product: 'true' }
          - { variant: 1.21.11-fabric, mc: '1.21.11', loader: fabric,   mrt: fabric,   java: '21', gradle: '9.5.0', api: 0.141.4, product: 'true' }
          - { variant: 1.21.1-fabric,  mc: '1.21.1',  loader: fabric,   mrt: fabric,   java: '21', gradle: '9.5.0', api: 0.107.0, product: 'true' }
          - { variant: 26.3-fabric,    mc: '26.3',    loader: fabric,   mrt: fabric,   java: '25', gradle: '9.8.2', api: 0.165.0, product: 'false', control: negative }
          - { variant: 26.3-neoforge,  mc: '26.3',    loader: neoforge, mrt: neoforge, java: '25', gradle: '9.2.1', api: 'none',      product: 'false', control: negative }
          - { variant: 1.21.11-fabric, mc: '1.21.11', loader: fabric,   mrt: fabric,   java: '21', gradle: '9.5.0', api: 0.141.4, product: 'false', control: negative }
          - { variant: 1.21.1-fabric,  mc: '1.21.1',  loader: fabric,   mrt: fabric,   java: '21', gradle: '9.5.0', api: 0.107.0, product: 'false', control: negative }
          - { variant: 1.12.2-forge, mc: '1.12.2', loader: forge, mrt: server, java: '8', gradle: '4.10.3', api: 'none', product: 'false', control: negative }
          - { variant: 1.20.1-forge, mc: '1.20.1', loader: forge, mrt: forge, java: '17', gradle: '8.14.5', api: 'none', product: 'false', control: negative }
          - { variant: 1.20.1-fabric, mc: '1.20.1', loader: fabric, mrt: fabric, java: '21', gradle: '9.5.1', api: 0.92.11, product: 'false', control: negative }
          - { variant: 1.21.1-forge, mc: '1.21.1', loader: forge, mrt: forge, java: '21', gradle: '8.14.5', api: 'none', product: 'false', control: negative }
          - { variant: 1.21.4-fabric, mc: '1.21.4', loader: fabric, mrt: fabric, java: '21', gradle: '9.5.0', api: 0.119.4, product: 'false', control: negative }
          - { variant: 1.21.4-neoforge, mc: '1.21.4', loader: neoforge, mrt: neoforge, java: '21', gradle: '9.2.1', api: 'none', product: 'false', control: negative }
          - { variant: 1.21.8-fabric, mc: '1.21.8', loader: fabric, mrt: fabric, java: '21', gradle: '9.5.0', api: 0.134.0, product: 'false', control: negative }
          - { variant: 1.21.8-neoforge, mc: '1.21.8', loader: neoforge, mrt: neoforge, java: '21', gradle: '9.2.1', api: 'none', product: 'false', control: negative }
          - { variant: 1.12.2-forge, mc: '1.12.2', loader: forge, mrt: server, java: '8', gradle: '4.10.3', api: 'none', product: 'true' }
          - { variant: 1.20.1-forge, mc: '1.20.1', loader: forge, mrt: forge, java: '17', gradle: '8.14.5', api: 'none', product: 'true' }
          - { variant: 1.20.1-fabric, mc: '1.20.1', loader: fabric, mrt: fabric, java: '21', gradle: '9.5.1', api: 0.92.11, product: 'true' }
          - { variant: 1.21.1-forge, mc: '1.21.1', loader: forge, mrt: forge, java: '21', gradle: '8.14.5', api: 'none', product: 'true' }
          - { variant: 1.21.4-fabric, mc: '1.21.4', loader: fabric, mrt: fabric, java: '21', gradle: '9.5.0', api: 0.119.4, product: 'true' }
          - { variant: 1.21.4-neoforge, mc: '1.21.4', loader: neoforge, mrt: neoforge, java: '21', gradle: '9.2.1', api: 'none', product: 'true' }
          - { variant: 1.21.8-fabric, mc: '1.21.8', loader: fabric, mrt: fabric, java: '21', gradle: '9.5.0', api: 0.134.0, product: 'true' }
          - { variant: 1.21.8-neoforge, mc: '1.21.8', loader: neoforge, mrt: neoforge, java: '21', gradle: '9.2.1', api: 'none', product: 'true' }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}
      - uses: gradle/actions/setup-gradle@v4
        with:
          cache-disabled: true
          gradle-version: ${{ matrix.gradle }}
      - name: Clear NeoForm cache
        if: contains(matrix.variant, 'neoforge')
        run: rm -rf "${{ matrix.variant }}/build/tmp/.cache"
      - name: Build ${{ matrix.variant }}
        working-directory: ${{ matrix.variant }}
        run: ./gradlew clean build --no-daemon --stacktrace

      - name: Stage probe (always) and product (green legs only)
        run: |
          mkdir -p run/mods
          cp "${{ matrix.variant }}"/build/libs/keepinventory-testmod-${{ matrix.variant }}-1.0.0.jar run/mods/
          if [ "${{ matrix.product }}" = "true" ]; then
            cp "${{ matrix.variant }}"/build/libs/keepinventory-${{ matrix.variant }}-1.0.0.jar run/mods/
          fi
          ls -la run/mods

      - name: Launch Minecraft ${{ matrix.mc }} (${{ matrix.loader }}) with in-game probe
        id: mcrt
        if: matrix.variant != '1.12.2-forge'
        continue-on-error: ${{ matrix.product == 'false' }}
        uses: headlesshq/mc-runtime-test@5.0.0
        with:
          mc: ${{ matrix.mc }}
          modloader: ${{ matrix.loader }}
          mc-runtime-test: ${{ matrix.mrt }}
          xvfb: "true"
          java: ${{ matrix.java }}
          fabric-api: ${{ matrix.api }}
          headlessmc-command: '--jvm "-DMcRuntimeGameTest=false"'

      - name: Boot Forge 1.12.2 server with Mineflayer bot
        if: matrix.variant == '1.12.2-forge'
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p server && cd server
          curl -fsSLO https://maven.minecraftforge.net/net/minecraftforge/forge/1.12.2-14.23.5.2847/forge-1.12.2-14.23.5.2847-installer.jar
          java -jar forge-1.12.2-14.23.5.2847-installer.jar --installServer > install.log 2>&1 || { cat install.log; exit 1; }
          echo "eula=true" > eula.txt
          echo "online-mode=false" > server.properties
          mkdir -p mods
          cp ../run/mods/*.jar mods/
          SRV_JAR=$(find . -maxdepth 1 -name 'forge-*.jar' ! -name '*installer*' -print -quit)
          test -n "$SRV_JAR" || { echo "FAIL: no Forge server jar"; exit 1; }
          java -jar "$SRV_JAR" nogui > server.log 2>&1 &
          echo $! > server.pid
          cd ..
          for i in $(seq 1 90); do
            grep -q 'Done (' server/server.log 2>/dev/null && break
            sleep 2
          done
          grep -q 'Done (' server/server.log || { tail -60 server/server.log; exit 1; }
          npm install mineflayer@4.39.0 --no-save >/dev/null 2>&1
          node .github/scripts/mineflayer-idle.js > bot.log 2>&1 &
          BOT_PID=$!
          for i in $(seq 1 120); do
            [ -f server/kip-result.txt ] && break
            sleep 1
          done
          kill "$BOT_PID" 2>/dev/null || true
          kill "$(cat server/server.pid)" 2>/dev/null || true
          cp server/kip-result.txt kip-result.txt 2>/dev/null || true
          mkdir -p run
          cp server/run/kip-result.txt run/kip-result.txt 2>/dev/null || true
          echo "=== bot log ==="; cat bot.log || true
          echo "=== server log tail ==="; tail -40 server/server.log || true
          test -f kip-result.txt

      - name: Assert behavior marker
        shell: bash
        run: |
          cat $(find . -name latest.log -print 2>/dev/null) > kip.log 2>/dev/null || true
          cat kip-result.txt run/kip-result.txt 2>/dev/null >> kip.log || true
          echo "=== behavior marker ==="
          grep 'KEEPINVENTORY_TEST_RESULT:' kip.log || true
          if grep -qiE 'gamerule[ .]keep[_ ]?inventory.*(updated|changed|true|false)' kip.log; then
            echo "FAIL: gamerule change was broadcast"
            grep -iE 'gamerule[ .]keep[_ ]?inventory' kip.log || true
            exit 1
          fi
          test "$(grep -h '^KEEPINVENTORY_TEST_RESULT:' kip-result.txt run/kip-result.txt 2>/dev/null | sort -u | wc -l)" -eq 1
          if [ "${{ matrix.product }}" = "true" ]; then
            grep -q 'KEEPINVENTORY_TEST_RESULT: PASS' kip.log
            grep -q 'product=true' kip.log
          else
            grep -q 'KEEPINVENTORY_TEST_RESULT: FAIL' kip.log
            grep -q 'product=false' kip.log
            grep -q 'item_lost_on_death' kip.log
            grep -q 'rule_not_restored' kip.log
          fi

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: behavior-${{ matrix.variant }}-${{ matrix.control || 'green' }}
          path: |
            kip.log
            kip-result.txt
            run/kip-result.txt
            run/logs/
            .minecraft/logs/
            **/latest.log
          if-no-files-found: warn
