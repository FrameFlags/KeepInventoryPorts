name: Keep Inventory in-game behavior test

on: [push, pull_request, workflow_dispatch]

permissions:
  contents: read

jobs:
  behavior:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        include:
          - { variant: 26.3-fabric,    mc: '26.3',    loader: fabric,   mrt: fabric,   java: '25', gradle: '9.8.2', api: 0.165.0, product: 'true' }
          - { variant: 26.3-neoforge,  mc: '26.3',    loader: neoforge, mrt: neoforge, java: '25', gradle: '9.2.1', api: '',      product: 'true' }
          - { variant: 1.21.11-fabric, mc: '1.21.11', loader: fabric,   mrt: fabric,   java: '21', gradle: '9.5.0', api: 0.141.4, product: 'true' }
          - { variant: 1.21.1-fabric,  mc: '1.21.1',  loader: fabric,   mrt: fabric,   java: '21', gradle: '9.5.0', api: 0.107.0, product: 'true' }
          - { variant: 26.3-fabric,    mc: '26.3',    loader: fabric,   mrt: fabric,   java: '25', gradle: '9.8.2', api: 0.165.0, product: 'false', control: negative }
          - { variant: 26.3-neoforge,  mc: '26.3',    loader: neoforge, mrt: neoforge, java: '25', gradle: '9.2.1', api: '',      product: 'false', control: negative }
          - { variant: 1.21.11-fabric, mc: '1.21.11', loader: fabric,   mrt: fabric,   java: '21', gradle: '9.5.0', api: 0.141.4, product: 'false', control: negative }
          - { variant: 1.21.1-fabric,  mc: '1.21.1',  loader: fabric,   mrt: fabric,   java: '21', gradle: '9.5.0', api: 0.107.0, product: 'false', control: negative }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}
      - uses: gradle/actions/setup-gradle@v4
        with:
          cache: false
          gradle-version: ${{ matrix.gradle }}
      - name: Build ${{ matrix.variant }}
        working-directory: ${{ matrix.variant }}
        run: ./gradlew clean build --no-daemon --stacktrace

      - name: Stage probe (always) and product (green legs only)
        run: |
          mkdir -p run/mods
          cp "${{ matrix.variant }}"/build/libs/keepinventory-testmod-${{ matrix.variant }}-1.0.0.jar run/mods/
          if [ "${{ matrix.product }}" = "true" ]; then
            cp "${{ matrix.variant }}"/build/libs/keepinventory-${{ matrix.variant }}-1.0.0.jar run/mods/
          fi
          ls -la run/mods

      - name: Launch Minecraft ${{ matrix.mc }} (${{ matrix.loader }}) with in-game probe
        id: mcrt
        continue-on-error: ${{ matrix.product == 'false' }}
        uses: headlesshq/mc-runtime-test@5.0.0
        with:
          mc: ${{ matrix.mc }}
          modloader: ${{ matrix.loader }}
          mc-runtime-test: ${{ matrix.mrt }}
          xvfb: "true"
          java: ${{ matrix.java }}
          fabric-api: ${{ matrix.api }}
          headlessmc-command: '--jvm "-DMcRuntimeGameTest=false"'

      - name: Assert behavior marker
        shell: bash
        run: |
          cat $(find . -name latest.log -print 2>/dev/null) > kip.log 2>/dev/null || true
          cat kip-result.txt run/kip-result.txt 2>/dev/null >> kip.log || true
          echo "=== behavior marker ==="
          grep 'KEEPINVENTORY_TEST_RESULT:' kip.log || true
          test "$(grep -h 'KEEPINVENTORY_TEST_RESULT:' kip-result.txt run/kip-result.txt kip.log 2>/dev/null | sort -u | wc -l)" -eq 1
          if [ "${{ matrix.product }}" = "true" ]; then
            grep -q 'KEEPINVENTORY_TEST_RESULT: PASS' kip.log
            grep -q 'product=true' kip.log
          else
            grep -q 'KEEPINVENTORY_TEST_RESULT: FAIL' kip.log
            grep -q 'product=false' kip.log
            grep -q 'item_lost_on_death' kip.log
            grep -q 'rule_not_restored' kip.log
          fi

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: behavior-${{ matrix.variant }}-${{ matrix.control || 'green' }}
          path: |
            kip.log
            kip-result.txt
            run/kip-result.txt
            run/logs/
            .minecraft/logs/
            **/latest.log
          if-no-files-found: warn
