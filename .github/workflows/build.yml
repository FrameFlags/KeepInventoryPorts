name: Keep Inventory build

on: [push, pull_request, workflow_dispatch]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - { variant: 26.3-fabric,     java: '25', gradle: '9.8.2', artifact: keepinventory-26.3-fabric }
          - { variant: 26.3-neoforge,   java: '25', gradle: '9.2.1', artifact: keepinventory-26.3-neoforge }
          - { variant: 1.21.11-fabric,  java: '21', gradle: '9.5.0', artifact: keepinventory-1.21.11-fabric }
          - { variant: 1.21.1-fabric,   java: '21', gradle: '9.5.0', artifact: keepinventory-1.21.1-fabric }
          - { variant: 1.12.2-forge,    java: '8',  gradle: '4.10.3', artifact: keepinventory-1.12.2-forge }
          - { variant: 1.20.1-forge,    java: '17', gradle: '8.14.5', artifact: keepinventory-1.20.1-forge }
          - { variant: 1.20.1-fabric,   java: '21', gradle: '9.5.1',  artifact: keepinventory-1.20.1-fabric }
          - { variant: 1.21.1-forge,    java: '21', gradle: '8.14.5', artifact: keepinventory-1.21.1-forge }
          - { variant: 1.21.4-fabric,   java: '21', gradle: '9.5.0',  artifact: keepinventory-1.21.4-fabric }
          - { variant: 1.21.4-neoforge, java: '21', gradle: '9.2.1',  artifact: keepinventory-1.21.4-neoforge }
          - { variant: 1.21.8-fabric,   java: '21', gradle: '9.5.0',  artifact: keepinventory-1.21.8-fabric }
          - { variant: 1.21.8-neoforge, java: '21', gradle: '9.2.1',  artifact: keepinventory-1.21.8-neoforge }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}
      - uses: gradle/actions/setup-gradle@v4
        with:
          cache-disabled: true
          gradle-version: ${{ matrix.gradle }}
      - name: Clear NeoForm cache
        if: contains(matrix.variant, 'neoforge')
        run: rm -rf "${{ matrix.variant }}/build/tmp/.cache"
      - name: Build ${{ matrix.variant }}
        working-directory: ${{ matrix.variant }}
        run: ./gradlew clean build --no-daemon --stacktrace
      - name: Verify jar names
        run: |
          ls -la ${{ matrix.variant }}/build/libs
          test -f ${{ matrix.variant }}/build/libs/${{ matrix.artifact }}-1.0.0.jar
          test -f ${{ matrix.variant }}/build/libs/keepinventory-testmod-${{ matrix.variant }}-1.0.0.jar
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: build-${{ matrix.variant }}
          path: |
            ${{ matrix.variant }}/build/libs/*.jar
          if-no-files-found: warn
