plugins {
    id 'java-library'
    id 'maven-publish'
    id 'net.neoforged.gradle.userdev' version '7.1.38'
}

tasks.named('wrapper', Wrapper).configure {
    distributionType = Wrapper.DistributionType.BIN
}

version = mod_version
group = mod_group_id
base { archivesName = "keepinventory-1.21.4-neoforge" }

java.toolchain.languageVersion = JavaLanguageVersion.of(21)

runs {
    configureEach {
        systemProperty 'forge.logging.markers', 'REGISTRIES'
        systemProperty 'forge.logging.console.level', 'debug'
        workingDirectory project.layout.projectDirectory.dir('run').dir(name)
        modSource project.sourceSets.main
    }
    client { systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id }
    server {
        systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        argument '--nogui'
    }
    gameTestServer { systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id }
}

configurations { runtimeClasspath.extendsFrom localRuntime }

dependencies {
    implementation "net.neoforged:neoforge:${neo_version}"
    testImplementation "org.junit.jupiter:junit-jupiter:5.10.3"
    testRuntimeOnly "org.junit.platform:junit-platform-launcher:1.10.3"
}

tasks.named('processResources', ProcessResources).configure {
    var replaceProperties = [
            minecraft_version: minecraft_version, minecraft_version_range: minecraft_version_range,
            neo_version: neo_version, loader_version_range: loader_version_range,
            mod_id: mod_id, mod_name: mod_name, mod_license: mod_license, mod_version: mod_version,
            mod_group_id: mod_group_id, mod_authors: mod_authors, mod_description: mod_description,
    ]
    inputs.properties replaceProperties
    filesMatching(['META-INF/neoforge.mods.toml']) { expand replaceProperties }
}

tasks.withType(JavaCompile).configureEach { options.encoding = 'UTF-8' }
test { useJUnitPlatform(); testLogging { events "passed", "failed", "skipped" } }

// Client asset downloads are not needed to compile the mod; skip them in headless builds.
tasks.matching { it.name.contains('DownloadAssets') }.configureEach { enabled = false }

tasks.named('jar') { exclude 'asd/itamio/keepinventory_test/**' }

tasks.register('testmodJar', Jar) {
    archiveBaseName = "keepinventory-testmod-1.21.4-neoforge"
    from(sourceSets.main.output.classesDirs) { include 'asd/itamio/keepinventory_test/**' }
    from('src/testmod/resources')
}
build.dependsOn testmodJar
