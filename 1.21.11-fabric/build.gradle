plugins { id 'net.fabricmc.fabric-loom-remap' version "${loom_version}" }
version = project.mod_version
group = project.maven_group
base { archivesName = "keepinventory-1.21.11-fabric" }
repositories { }
loom { mods { "keepinventory" { sourceSet sourceSets.main } } }
dependencies {
 minecraft "com.mojang:minecraft:${project.minecraft_version}"
 mappings loom.officialMojangMappings()
 modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"
 modImplementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"
 testImplementation "org.junit.jupiter:junit-jupiter:5.10.3"
 testRuntimeOnly "org.junit.platform:junit-platform-launcher:1.10.3"
}
processResources { inputs.property "version", version; filesMatching("fabric.mod.json") { expand "version": version } }
tasks.withType(JavaCompile).configureEach { options.release = 19 }
java { sourceCompatibility = JavaVersion.VERSION_21; targetCompatibility = JavaVersion.VERSION_21 }
test { useJUnitPlatform(); testLogging { events "passed", "failed", "skipped" } }

tasks.named('jar') { exclude 'asd/itamio/keepinventory_test/**' }

tasks.register('testmodJar', Jar) {
 archiveBaseName = "keepinventory-testmod-1.21.11-fabric"
 from(sourceSets.main.output.classesDirs) { include 'asd/itamio/keepinventory_test/**' }
 from('src/testmod/resources')
}
build.dependsOn testmodJar
